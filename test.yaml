---
- hosts: mywebservers
  become: yes
  gather_facts: yes
  tasks: 
  - name: i want to install webserver on ansible Debian node task01 (apt-get install apache2 -y )
    apt:
      name: apache2
      state: present 
    when: ansible_os_family=="Debian"
    
  - name: i want to start webserver on ansible Debian node task02 (service apache2 start )
    service:
      name: apache2
      state: started 
    when: ansible_os_family=="Debian"

  - name: i want to install webserver on ansible RedHat node task03 (apt-get install httpd -y )
    yum:
      name: httpd
      state: present 
    when: ansible_os_family=="RedHat"

    - name: i want to start webserver on ansible RedHat node task04 (apt-get install httpd -y )
    service:
      name: httpd
      state: started 
    when: ansible_os_family=="RedHat"  