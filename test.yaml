---
- hosts: mywebservers
  become: yes
  gather_facts: yes
  tasks: 
  - name: i want to install webserver on this task01 (apt-get install apache2 -y )
    apt:
      name: apache2
      state: present 
    when: ansible_os_family=="Debian"
  - name: i want to install webserver on this task01 (apt-get install httpd -y )
    apt:
      name: httpd
      state: present 
    when: ansible_os_family=="RedHat"